# 已有 Release 的归档保持原样，只补发同版本容器镜像。
name: Repair release image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的版本标签
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: repair-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检查版本标签格式
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: 检出镜像构建配置
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 检出已发布代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: 下载并校验已发布归档
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "laull-home-${RELEASE_TAG}.tar.gz*" --dir artifacts
          cd artifacts
          sha256sum --check "laull-home-${RELEASE_TAG}.tar.gz.sha256"
          cd ..
          tar -xzf "artifacts/laull-home-${RELEASE_TAG}.tar.gz" -C source --strip-components=1
          cp .dockerignore source/.dockerignore
          commit="$(git -C source rev-parse HEAD)"
          git -C source merge-base --is-ancestor "$commit" origin/main
          test "$(jq -r .commit source/release.json)" = "$commit"
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version source/release.json)" = "$version"
          test "$(jq -r .version source/package.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: 检查运行镜像
        run: |
          docker build -f Dockerfile.release -t laull-home:repair ./source
          docker run --rm -d --name laull-home-repair -p 127.0.0.1:18080:3000 \
            -e LAULL_HOME_ORIGIN=http://127.0.0.1:18080 laull-home:repair
          trap 'docker rm -f laull-home-repair' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs laull-home-repair
          exit 1
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3
      - name: 登录 GitHub Packages 容器镜像库
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 补发双架构镜像
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318 # v6
        with:
          context: ./source
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: 检查镜像双架构清单
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > manifest.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' manifest.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' manifest.json
